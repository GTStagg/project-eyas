name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Build needs to succeed without real credentials. The runtime env
          # validation only fires on actual request-handling, not at build.
          NEXT_TELEMETRY_DISABLED: "1"

  node-tests:
    # Deterministic regression suites: approvals, login throttling, first-run
    # registration, settings store, IR ground truth / eligibility / analysis,
    # parsing and the rest. No network, no real credentials; every suite that
    # opens a database gets a throwaway FALCON_DATA_DIR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run regression suites
        run: |
          set -euo pipefail
          export FALCON_DATA_DIR="$(mktemp -d)"
          suites=$(node -e 'const s=require("./package.json").scripts; console.log(Object.keys(s).filter(k=>k.startsWith("test:")&&!["test:smoke","test:sidecar"].includes(k)).join(" "))')
          failed=0
          for s in $suites; do
            echo "::group::$s"
            if npm run -s "$s"; then echo "PASS $s"; else echo "::error::$s failed"; failed=1; fi
            echo "::endgroup::"
          done
          test -z "$(ls -A data 2>/dev/null)" || { echo "::error::a suite wrote to ./data"; exit 1; }
          exit $failed

  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sidecar dependencies (hash-locked)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r falcon-extras/requirements.txt
      - name: Run every falcon-extras test suite
        run: SIDECAR_PYTHON="$RUNNER_TEMP/venv/bin/python" bash scripts/run-sidecar-tests.sh

  docker:
    # Clean image build from tracked sources, then boot it with a throwaway
    # session secret and check the liveness endpoint. No Falcon or Anthropic
    # credentials; nothing upstream is called.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          AUTH_SESSION_SECRET=ci FALCON_MCP_API_KEY=ci docker compose config --quiet
      - name: Build app image (no cache)
        run: docker build --no-cache --build-arg GIT_SHA="$GITHUB_SHA" -t eyas-app:ci .
      - name: Boot and probe /api/healthz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 1001:1001 "$RUNNER_TEMP/data"
          docker run -d --name eyas -p 127.0.0.1:3000:3000 \
            -e AUTH_SESSION_SECRET="$(openssl rand -hex 32)" \
            -e FALCON_EXTRAS_ENABLED=false \
            -v "$RUNNER_TEMP/data:/app/data" eyas-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/register)
          echo "/register -> $code"
          test "$code" = "200"
          U=http://127.0.0.1:3000
          expect() { # label expected-code curl-args...
            local label=$1 want=$2; shift 2
            local got; got=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            echo "$label -> $got (want $want)"
            test "$got" = "$want"
          }
          # Cross-site guard on state-changing API requests.
          expect "cross-site POST" 403 -X POST -H 'Sec-Fetch-Site: cross-site' -H 'Content-Type: text/plain' "$U/api/webhook"
          expect "same-site (other port) POST" 403 -X POST -H 'Sec-Fetch-Site: same-site' "$U/api/webhook"
          expect "foreign Origin without Sec-Fetch-Site" 403 -X POST -H 'Origin: http://evil.example' "$U/api/webhook"
          expect "same-origin POST reaches auth (redirect)" 307 -X POST -H 'Sec-Fetch-Site: same-origin' "$U/api/webhook"
          expect "matching Origin reaches auth (redirect)" 307 -X POST -H "Origin: $U" "$U/api/webhook"
          # Registration only for loopback host names (DNS-rebinding guard).
          expect "register via rebinding host" 403 -H 'Host: attacker.example' "$U/register"
          # Asset-extension auth exemption is anchored to the end of the path.
          expect "extension mid-path doesn't skip auth" 307 "$U/api/health.png/x"
          # Data files are owner-only.
          docker exec eyas sh -c 'stat -c "%a %n" /app/data /app/data/eyas.db*'
          test "$(docker exec eyas stat -c %a /app/data/eyas.db)" = "600"
          docker exec eyas test -f /app/LICENSE
          docker exec eyas test -f /app/licenses/THIRD-PARTY-NOTICES.txt
          docker exec eyas test -f /app/licenses/fonts/InterTight-OFL.txt
      - name: Container logs
        if: always()
        run: docker logs eyas || true

  smoke:
    runs-on: ubuntu-latest
    needs: build
    # Browser smoke tests need a running app + a real upstream MCP. Skipped on
    # CI until a mock MCP exists; run locally before release.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
