name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Eyas
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with Eyas!

        **Never include API keys, passwords, tenant IDs, host names, detections or other tenant data.**
        Security problems go through private vulnerability reporting, not a public issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Initial Checks
      options:
        - label: I'm running the latest release of Eyas
          required: true
        - label: I searched existing issues before opening this report
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open /...
        2. Ask the agent to...
        3. See error...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Eyas?
      options:
        - Local dev server (npm run dev)
        - Standalone bundle (make-dist.sh / install.sh)
        - Docker Compose
        - Other (please describe)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: The /status page shows most of this.
      placeholder: |
        - Eyas version: 0.9.1
        - OS: macOS 15 / Ubuntu 24.04
        - Node: 22.x
        - Model endpoint: Anthropic API / corporate gateway
        - Falcon API region: US-1
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs (Optional)
      description: Remove credentials and tenant data before pasting.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context (Optional)
