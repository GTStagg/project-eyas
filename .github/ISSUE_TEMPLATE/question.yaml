name: ❓ Question
description: Ask a question about setting up or using Eyas
title: "[Question]: "
labels: ["question"]

body:
  - type: checkboxes
    id: checks
    attributes:
      label: Initial Checks
      options:
        - label: I searched existing issues
          required: true
        - label: I checked the README, QUICKSTART and docs/
          required: true

  - type: dropdown
    id: question_type
    attributes:
      label: Question Type
      options:
        - Installation and setup
        - Falcon API scopes and credentials
        - Anthropic API or gateway configuration
        - Using a page or agent workflow
        - Deployment (bundle, Docker, reverse proxy)
        - Security and data handling
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (Optional)
      description: "**Please don't include API credentials or tenant data.**"
      placeholder: |
        - How you run Eyas: dev server / bundle / Docker
        - OS and Node version
      render: text
